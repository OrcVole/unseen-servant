# Fuzz harness — its own workspace so `cargo build/test` in the parent stays
# stable-toolchain and dependency-free; fuzzing runs on nightly via cargo-fuzz:
#
#   cargo +nightly fuzz run frame_request_line
#
# The brief's rule: ALL parsing is fuzzed. Targets are added in the same phase
# as the parser they attack (BUILD-PLAN): frame_request_line (C0), URI
# validation + config (C1), static-file path sanitization (C2), gemtext (C3),
# titan parameters (C4).

[package]
name = "unseen-servant-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.unseen-servant]
path = ".."

[[bin]]
name = "frame_request_line"
path = "fuzz_targets/frame_request_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_uri"
path = "fuzz_targets/validate_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "static_path_sanitize"
path = "fuzz_targets/static_path_sanitize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_gemtext"
path = "fuzz_targets/parse_gemtext.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_html"
path = "fuzz_targets/render_html.rs"
test = false
doc = false

[[bin]]
name = "parse_titan"
path = "fuzz_targets/parse_titan.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
