# Unseen Servant — see AGENTS.md for the read order and invariants.
#
# Dependency policy (docs/internal/BRIEF.md "explicit version pinning throughout" + ADR 0001):
# this crate has ZERO dependencies at phase C0, deliberately. The first dependencies
# (tokio, rustls, rcgen, serde/toml, tracing — the ADR 0001 set, nothing else) land in
# phase C1, each with an explicit version, and Cargo.lock is committed. cargo-deny
# config (deny.toml) is already in place and becomes load-bearing at that moment.

[package]
name = "unseen-servant"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Unseen Servant (usv): security-first Gemini server that publishes one content tree to Geminispace and the web"
repository = "https://forgejo.unseenservant.dev/unseen-servant/unseen-servant"
readme = "README.md"
keywords = ["gemini", "gemtext", "server", "smolnet"]
categories = ["network-programming"]
# Not on crates.io until the v1.0 release gates pass (docs/internal/ROADMAP.md M5/M6).
publish = false

# `publish = false` also hides the binary from `dist` (cargo-dist) by
# default, since dist's usual signal for "this is a real release artifact"
# is publishability; opt back in explicitly — pre-release binary tarballs
# are exactly what docs/internal/BUILD-PLAN.md C6 asks for, crates.io publication is
# a separate, later gate.
[package.metadata.dist]
dist = true

[lib]
name = "unseen_servant"
path = "src/lib.rs"

[[bin]]
name = "usv"
path = "src/main.rs"

[lints.rust]
# The security argument of ADR 0002 rests on this line plus fuzzing. A written
# justification in an ADR amendment is required before it may ever be relaxed.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# Warnings are errors in CI; these two are always errors, everywhere.
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
crossterm = "0.29"
notify = "8.2.0"
ratatui = "0.30.2"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem"] }
regex = "1.13.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# Direct dependency (already pulled in transitively by rustls at this exact
# version) so tls.rs can verify a client certificate's handshake signature
# against its bare SubjectPublicKeyInfo, bypassing webpki's EndEntityCert
# parser — which hard-rejects any certificate that isn't X.509v3. Gemini
# client certs are commonly minimal self-signed certs that omit the version
# field entirely (which defaults to v1 per RFC 5280), so that rejection is a
# real interop break, not a security-relevant one (see tls.rs module docs).
rustls-webpki = { version = "0.103.13", default-features = false, features = ["alloc", "ring"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
socket2 = "0.6.5"
time = { version = "0.3.55", features = ["macros", "parsing", "formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros", "fs"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "1.1.4"
tracing = "0.1.44"
# "json" backs USV_LOG_FORMAT=json (docs/agents.md): the same events, one
# object per line, for log collectors and for agents reading their own
# server's output. It is the only feature added beyond the ADR 0001 set.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.8"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
sha2 = "0.11.0"
time = "0.3.55"
