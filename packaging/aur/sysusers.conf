## systemd-sysusers declaration for the dedicated usv system user
## (ADR 0002 — never runs as root). Arch's idiomatic equivalent of the
## .deb package's adduser call in postinst; applied automatically by
## systemd-sysusers.service, no packaging script needed.
u usv - "Unseen Servant" /var/lib/usv /usr/sbin/nologin
