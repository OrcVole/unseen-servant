# .forgejo/workflows/pr-checks.yml — Rust gates for the unseen-servant PRODUCT repo.
#
# Modelled on estate/templates/forgejo-pr-checks.yml (the packaging-repo gate file) but this
# repository is a product, not a package: at C0 there is no image to build, no secret-scan
# surface beyond generic shapes, and no smoke.sh. The packaging gates arrive with the
# packaging artifacts at phase C6 (docs/BUILD-PLAN.md); do not graft them on earlier — a gate
# with nothing real to prove is decoration.
#
# RUNNER FACTS (inherited from the estate template, verified 2026-08-08 there):
#   * label `workstation`, HOST mode — steps run directly on the build workstation, not in a
#     job container. The workspace is a real directory; assume nothing about cleanliness
#     beyond your own checkout.
#   * The job inherits the runner unit's minimal PATH. cargo lives in ~/.cargo/bin on that
#     machine, which is NOT guaranteed to be on that PATH — hence the explicit export below.
#   * rust-toolchain.toml pins 1.93.1; under rustup this is honoured automatically. If the
#     runner's rust is not rustup-managed the system toolchain applies — the `toolchain facts`
#     step prints what actually ran, so a drifted gate is at least a *visible* drifted gate.
#
# C1 addition (2026-08-09): cargo-deny is now load-bearing (first dependencies landed) and
# fuzz smoke runs bounded (60s/target) on the nightly toolchain, per the brief's "every parser
# is fuzzed" rule — this is a smoke check for crashes, not a coverage campaign; the extended
# fuzz corpus work is C7. Both need one-time host setup the runner facts note here so a
# drifted runner is visible rather than silently skipped:
#   * cargo-deny: `cargo install cargo-deny --locked` on the runner if not already present.
#   * nightly + cargo-fuzz: `rustup toolchain install nightly` and
#     `cargo install cargo-fuzz --locked` on the runner.
#
# 2026-08-10: this drift actually happened — cargo-fuzz was never installed on the
# `workstation` runner, so every run since this step landed (#16 through #52, checked via the
# Forgejo Actions API, not assumed) failed in ~44s at "no such command: `fuzz`", well before
# reaching a real test result. Nobody had been checking remote CI status against local `cargo
# test` passing, so it went unnoticed for over a day. Fixed by actually running the two setup
# commands above on the runner and confirming `cargo fuzz run frame_request_line -- -max_total_time=10`
# succeeds standalone before trusting the next CI run. The lesson, not just the fix: a
# green local gate is not a green CI gate — check the remote run, don't infer it.
# Triggers include push-to-main because the project currently works by direct push (solo
# AI-authored, director-reviewed); when the Update-as-PR culture arrives here, the push
# trigger can go.
#
# 2026-08-10: run #62 failed with no error anywhere in its log — every visible cargo
# test/clippy/fmt result was clean (413+10+9+44+0 tests, all "ok"), and the log just
# stopped mid-`cargo deny check` with no failure line at all. It happened while heavy
# concurrent podman work (a Fedora container building an RPM, a Nix flake build with its
# own cargo compile) was running directly on this same physical machine — remember the
# HOST-mode runner-facts note above: this workstation *is* the runner, not an isolated
# box. Confirmed environmental, not a regression: run #63, on top of the same code plus a
# docs-only commit, passed clean once that concurrent work had settled. Lesson: don't run
# heavy local podman/cargo builds on this machine while a push is likely to trigger CI, or
# expect an occasional false-red that a same-commit (or superset-commit) retry clears.

name: PR checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  rust-gates:
    runs-on: workstation
    steps:
      - uses: actions/checkout@v4

      - name: toolchain facts
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version

      # Order: cheapest first, except that nothing here is expensive yet. fmt is a pure
      # style gate; clippy runs with warnings-as-errors (the Cargo.toml lints tables carry
      # the always-on lints); tests include the binary smoke tests via CARGO_BIN_EXE.
      - name: fmt
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --check

      - name: clippy (warnings are errors)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo clippy --all-targets -- -D warnings

      - name: test
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test

      - name: deny
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo deny check

      # Bounded smoke run, not a coverage campaign (C7 owns the extended corpus). Each target
      # gets 60s under nightly + cargo-fuzz; a crash fails the job, a clean 60s does not prove
      # absence of bugs, only that nothing broke since the last run.
      - name: fuzz smoke
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd fuzz
          for target in frame_request_line validate_uri config_parse static_path_sanitize parse_gemtext render_html parse_titan; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done
