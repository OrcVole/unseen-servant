# .forgejo/workflows/build-cloudron-image.yml — build the Cloudron package
# image off-host and push it, so `cloudron install/update --image <ref>`
# never has to compile ~130 crates from scratch inside the install itself.
#
# WHY THIS EXISTS (found live, 2026-08-10): installing usv on a busy,
# shared Cloudron (dozens of other apps) via the normal
# no-image `cloudron install` path took many minutes longer than a typical
# community app — the repo-root Dockerfile pulls the full `rust:1.93.1`
# dev image and compiles the entire dependency tree from scratch, on the
# same host every other app is competing with for disk I/O, on every
# single install. Building here instead and shipping a finished image is
# the same pattern this estate already uses elsewhere (e.g. prosody-
# cloudron's pinned `dockerImage` + `dockerImageSha256`) — usv doing a
# server-side compile was the outlier, not the norm.
#
# REGISTRY: this repo's own Forgejo instance (forgejo.wanderingmonster.dev)
# acting as an OCI registry, not an external one — one fewer credential to
# provision than GHCR or similar. First attempt used the Actions automatic
# GITHUB_TOKEN with `permissions: packages: write`: login succeeded, the
# push did not — "writing blob: ... authentication required". The
# auto-token's package-registry write scope evidently doesn't extend to
# pushing new blobs the way it does for e.g. checkout, at least not on
# this Forgejo version. Fixed by using REGISTRY_PUSH_TOKEN, a repo secret
# holding the same PAT already confirmed (elsewhere in this estate) to
# carry real `write:package` scope on this instance — a known-working
# credential instead of an untested assumption about the auto-token.
#
# RUNNER FACTS: same `workstation` HOST-mode runner as pr-checks.yml —
# steps run directly on a real machine, not an isolated container, so
# whatever build tool is invoked here (podman) must already be installed
# there. This workflow's first real run caught the auth issue above; its
# second run is what actually proved the fix, not this comment.
#
# PUSH RELIABILITY (found live, 2026-08-10): run #55, with auth fixed,
# still failed — the blob-upload PATCH died with `EOF` twice in a row at
# consistent ~4.5-minute intervals, exhausting podman's default `--retry 3`
# before the transfer could finish. Diagnosed by manually running the
# identical `podman push` from this same machine, outside CI: it
# succeeded outright, but took a genuine 6m30s — so the registry side is
# fine, this is just a slow transfer that's more prone to a transient
# connection drop than a fast one, and 3 quick-fire retries aren't enough
# runway. Fixed with a larger retry budget and a real delay between
# attempts, so a dropped connection gets another full attempt instead of
# immediately re-hitting the same bad window.
#
# Path-filtered: only the inputs that actually change the image should
# trigger a rebuild — a docs-only commit shouldn't burn a multi-minute
# compile.

name: Build and push Cloudron image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start.sh
      - CloudronManifest.json
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - .forgejo/workflows/build-cloudron-image.yml

jobs:
  build-and-push:
    runs-on: workstation
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          podman build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
        env:
          IMAGE: forgejo.wanderingmonster.dev/wanderingmonster/unseen-servant

      - name: push
        run: |
          echo "${{ secrets.REGISTRY_PUSH_TOKEN }}" | podman login forgejo.wanderingmonster.dev \
            --username "${{ github.actor }}" --password-stdin
          podman push --retry 8 --retry-delay 20s "${IMAGE}:${{ github.sha }}"
          podman push --retry 8 --retry-delay 20s "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${{ github.sha }} — install/update with:"
          echo "  cloudron install --image ${IMAGE}:${{ github.sha }}"
        env:
          IMAGE: forgejo.wanderingmonster.dev/wanderingmonster/unseen-servant
